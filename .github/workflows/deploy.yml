name: Deploy to Server (Auto CI/CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH orqali serverga ulanish va botni yangilash
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Loyiha papkasiga kirish
            if [ -d "/root/root/air-sentry_air-lookout" ]; then
              cd /root/root/air-sentry_air-lookout
            elif [ -d "/root/air-sentry_air-lookout" ]; then
              cd /root/air-sentry_air-lookout
            else
              cd ~/air-sentry_air-lookout
            fi

            echo "🚀 [1/3] Yangi kodlarni GitHub'dan yuklab olish..."
            git pull origin main

            echo "📦 [2/3] Yangi kutubxonalarni tekshirish va o'rnatish..."
            ./venv/bin/pip install -r requirements.txt

            echo "🔄 [3/3] Botni qayta ishga tushirish..."
            sudo systemctl restart weather_bot

            echo "✅ Muvaffaqiyatli yangilandi! Bot holati:"
            sudo systemctl status weather_bot --no-pager
